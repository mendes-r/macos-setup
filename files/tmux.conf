# use zsh as the default shell
set-option -g default-shell /bin/zsh

# remap prefix from 'C-b' to 'C-space'
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Resize the current pane: Ctrl-Up/Down (no prefix), prefix+Left/Right (avoids shell word-jump conflict)
bind -r -n C-Up resize-pane -U
bind -r -n C-Down resize-pane -D
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5

# mouse mode
set -g mouse on

# repeat time
set -g repeat-time 1000

# faster escape-time (fixes vim/neovim Esc lag)
set -g escape-time 10

# start windows/panes at 1, keep them contiguous
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# bigger scrollback for logs/build output
set -g history-limit 50000

# let vim/neovim autoread files changed in other panes
set -g focus-events on

# vi-style copy-mode with macOS clipboard integration
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Escape send-keys -X cancel

# plain mouse drag-select auto-copies to system clipboard on release,
# staying confined to the pane you clicked in (no need to press 'y').
# NOTE: don't hold Shift/Option while dragging - that bypasses tmux and
# uses the terminal's native selection, which ignores pane boundaries
# and will bleed into adjacent panes on multi-line selections.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# truecolor / undercurl support for modern terminal apps
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",xterm-256color:Ss=\E[%p1%d q:Se=\E[2 q"

# flag background activity in unfocused windows
setw -g monitor-activity on
set -g visual-activity on

# minimal status bar: session name left, clock right, bold current window
set -g status-interval 5
set -g status-left-length 30
set -g status-left "#[bold]#S "
set -g status-right "#[fg=colour245]%H:%M "
setw -g window-status-current-format "#[bold]#I:#W#F"

# reload config without restarting tmux
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

