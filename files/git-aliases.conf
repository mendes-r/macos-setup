# Default git aliases bundled by macos-setup, as name=value pairs.
# The installer only sets an alias if `git config --global alias.<name>` is
# not already defined — it never overwrites an existing alias.
hist=log --all --graph --decorate --oneline
a=add
aa=add .
s=status
co=checkout
cob=checkout -b
br=branch
cm=commit -m
cma=commit --amend -m
bra=branch -a  --format='%(HEAD) %(color:yellow)%(refname:short)%(color:reset) - %(contents:subject) %(color:blue)(%(committerdate:short)) [%(authorname)]' --sort=-committerdate
alias=config --get-regexp ^alias\.
last=log -1 HEAD
change=diff-tree --ext-diff -p
